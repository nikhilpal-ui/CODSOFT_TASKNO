<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | To-Do List App</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Header -->
    <header>
        <div>
            <h1><i class="fa-solid fa-list-check"></i> TaskFlow</h1>
            <p>Manage your daily tasks efficiently</p>
        </div>

        <button id="themeBtn">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- Add Task -->
    <section class="task-form">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task">

        <select id="category">
            <option value="">Category</option>
            <option>Personal</option>
            <option>Work</option>
            <option>Study</option>
            <option>Shopping</option>
            <option>Fitness</option>
        </select>

        <select id="priority">
            <option value="">Priority</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>

        <input
            type="date"
            id="dueDate">

        <button id="addTask">
            <i class="fa-solid fa-plus"></i>
            Add Task
        </button>

    </section>

    <!-- Search -->

    <section class="search-section">

        <input
            type="text"
            id="searchTask"
            placeholder="Search Task...">

    </section>

    <!-- Filter -->

    <section class="filters">

        <button class="filter active" data-filter="all">
            All
        </button>

        <button class="filter" data-filter="pending">
            Pending
        </button>

        <button class="filter" data-filter="completed">
            Completed
        </button>

    </section>

    <!-- Statistics -->

    <section class="stats">

        <div class="card">
            <h2 id="totalTasks">0</h2>
            <span>Total Tasks</span>
        </div>

        <div class="card">
            <h2 id="completedTasks">0</h2>
            <span>Completed</span>
        </div>

        <div class="card">
            <h2 id="pendingTasks">0</h2>
            <span>Pending</span>
        </div>

    </section>

    <!-- Task List -->

    <section class="task-list">

        <ul id="taskContainer">

            <!-- JavaScript Tasks -->

        </ul>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
