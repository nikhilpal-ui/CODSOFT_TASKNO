<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player | CodSoft Task 4</title>

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- ========================= -->
        <!-- HEADER -->
        <!-- ========================= -->

        <header>

            <h1>

                <i class="fa-solid fa-headphones"></i>

                Music Player

            </h1>

            <button id="themeBtn">

                <i class="fa-solid fa-moon"></i>

            </button>

        </header>

        <!-- ========================= -->
        <!-- PLAYER -->
        <!-- ========================= -->

        <div class="player">

            <img
                src="images/cover1.png"
                id="cover"
                alt="Album Cover">

            <h2 id="title">
                Song Title
            </h2>

            <p id="artist">
                Artist Name
            </p>

            <!-- Progress -->

            <div class="progress-area">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    type="range"
                    id="progress"
                    value="0"
                    min="0"
                    max="100">

                <span id="duration">
                    0:00
                </span>

            </div>

            <!-- Controls -->

            <div class="controls">

                <button id="shuffle">

                    <i class="fa-solid fa-shuffle"></i>

                </button>

                <button id="prev">

                    <i class="fa-solid fa-backward-step"></i>

                </button>

                <button id="play">

                    <i class="fa-solid fa-play"></i>

                </button>

                <button id="next">

                    <i class="fa-solid fa-forward-step"></i>

                </button>

                <button id="repeat">

                    <i class="fa-solid fa-repeat"></i>

                </button>

            </div>

            <!-- Volume -->

            <div class="volume-box">

                <button id="mute">

                    <i class="fa-solid fa-volume-high"></i>

                </button>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="100"
                    value="100">

            </div>

        </div>

        <!-- ========================= -->
        <!-- PLAYLIST -->
        <!-- ========================= -->

        <section class="playlist">

            <div class="playlist-header">

                <h2>

                    <i class="fa-solid fa-music"></i>

                    Playlist

                </h2>

            </div>

            <ul id="playlist">

                <!-- JavaScript -->

            </ul>

        </section>

    </div>

    <!-- Audio -->

    <audio id="audio"></audio>

    <script src="script.js"></script>

</body>

</html>
